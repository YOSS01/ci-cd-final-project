name: CI workflow

on: 
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]

  jobs: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Steup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm ci
      - name: Lint with ESlint
        run: |
          npm run Lint
      - name: Run unit tests with Jest
        run: |
          npm test
      